events {
    worker_connections 1024; 
}

http {
    server {
        listen 80;
        server_name example.com;


        location = /admin {
            deny all;
        }

        location / {
            #proxy_pass http://host.docker.internal:5000;
            proxy_pass http://flask-app:5000;
        }

    }
}

log_format uri_debug
    'request="$request" '
    'request_uri="$request_uri" '
    'uri="$uri" '
    'status="$status"';

access_log /home/kali/labs/1-prog/B-code-review/ uri_debug;
